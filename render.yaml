services:
  - type: web
    name: wedding-festa-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-festa-db
          property: connectionString
      - key: FIREBASE_STORAGE_BUCKET
        value: onnme-website.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: wedding-festa-db
    plan: free
