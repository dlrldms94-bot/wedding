<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 | 2026 서울 결혼페스타</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">

  <main class="admin-shell">
    <section id="admin-login" class="admin-card">
      <h1 class="admin-card__title">관리자 로그인</h1>
      <p class="admin-card__desc">게시글과 메인 팝업을 관리합니다.</p>
      <form id="admin-login-form" class="admin-form">
        <label class="admin-field">
          <span>비밀번호</span>
          <input type="password" id="admin-password" required autocomplete="current-password">
        </label>
        <p id="admin-login-error" class="admin-error" hidden></p>
        <button type="submit" class="admin-btn admin-btn--primary">로그인</button>
      </form>
    </section>

    <section id="admin-dashboard" class="admin-dashboard" hidden>
      <header class="admin-top">
        <div>
          <h1 class="admin-top__title">사이트 관리</h1>
          <p class="admin-top__desc">게시판 공지와 메인 팝업을 등록·수정할 수 있습니다.</p>
        </div>
        <button type="button" id="admin-logout" class="admin-btn admin-btn--ghost">로그아웃</button>
      </header>

      <div class="admin-tabs" role="tablist">
        <button type="button" class="admin-tabs__btn is-active" data-admin-tab="posts">게시글 관리</button>
        <button type="button" class="admin-tabs__btn" data-admin-tab="popups">팝업 관리</button>
      </div>

      <div class="admin-panels">
        <section class="admin-panel" data-admin-panel="posts">
          <div class="admin-grid">
            <form id="admin-post-form" class="admin-card admin-form">
              <h2 class="admin-card__title">게시글 등록</h2>
              <input type="hidden" id="admin-post-id">
              <label class="admin-field">
                <span>제목</span>
                <input type="text" id="admin-post-title" required>
              </label>
              <label class="admin-field">
                <span>날짜</span>
                <input type="date" id="admin-post-date" required>
              </label>
              <label class="admin-field">
                <span>내용</span>
                <div class="admin-editor">
                  <div class="admin-editor__toolbar">
                    <button type="button" id="admin-insert-table" class="admin-btn admin-btn--ghost admin-btn--sm">표 삽입</button>
                  </div>
                  <textarea id="admin-post-content" rows="10" required></textarea>
                </div>
                <p class="admin-field__hint">본문 URL(http://, https://, www.)은 자동 링크됩니다. 표는 <code>| 업체명 | 전화번호 | 홈페이지 |</code> 형식이며, 두 번째 줄 <code>| --- | --- | --- |</code> 다음에 데이터 행을 추가하세요. 홈페이지 칸에 URL을 넣으면 밑줄 링크로 표시됩니다.</p>
              </label>
              <label class="admin-field">
                <span>이미지</span>
                <div class="admin-media-field">
                  <input type="hidden" id="admin-post-image">
                  <div id="admin-post-image-preview" class="admin-media-field__preview" hidden></div>
                  <p id="admin-post-image-path" class="admin-media-field__path">선택된 이미지 없음</p>
                  <div class="admin-media-field__actions">
                    <button type="button" class="admin-btn admin-btn--ghost" data-media-open="admin-post-image">폴더에서 선택</button>
                    <button type="button" class="admin-btn admin-btn--ghost" data-media-clear="admin-post-image">제거</button>
                  </div>
                </div>
              </label>
              <label class="admin-field">
                <span>유튜브 링크</span>
                <input type="url" id="admin-post-youtube" placeholder="https://www.youtube.com/watch?v=...">
              </label>
              <label class="admin-check">
                <input type="checkbox" id="admin-post-notice">
                <span>공지하기 (상단 고정)</span>
              </label>
              <div class="admin-form__actions">
                <button type="submit" id="admin-post-submit" class="admin-btn admin-btn--primary">게시글 등록</button>
                <button type="button" id="admin-post-reset" class="admin-btn admin-btn--ghost">새로 작성</button>
              </div>
            </form>
            <div class="admin-card">
              <h2 class="admin-card__title">등록된 게시글</h2>
              <div id="admin-post-list" class="admin-list"></div>
            </div>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="popups" hidden>
          <div class="admin-grid">
            <form id="admin-popup-form" class="admin-card admin-form">
              <h2 class="admin-card__title">팝업 등록</h2>
              <input type="hidden" id="admin-popup-id">
              <label class="admin-field">
                <span>팝업 이미지</span>
                <div class="admin-media-field">
                  <input type="hidden" id="admin-popup-image">
                  <div id="admin-popup-image-preview" class="admin-media-field__preview" hidden></div>
                  <p id="admin-popup-image-path" class="admin-media-field__path">선택된 이미지 없음</p>
                  <div class="admin-media-field__actions">
                    <button type="button" class="admin-btn admin-btn--ghost" data-media-open="admin-popup-image">폴더에서 선택</button>
                    <button type="button" class="admin-btn admin-btn--ghost" data-media-clear="admin-popup-image">제거</button>
                  </div>
                </div>
              </label>
              <label class="admin-field">
                <span>이미지 클릭 시 이동 URL</span>
                <input type="text" id="admin-popup-link" placeholder="intro/overview.html">
              </label>
              <div class="admin-field-row">
                <label class="admin-field">
                  <span>노출 시작일</span>
                  <input type="date" id="admin-popup-start">
                </label>
                <label class="admin-field">
                  <span>노출 종료일</span>
                  <input type="date" id="admin-popup-end">
                </label>
              </div>
              <label class="admin-check">
                <input type="checkbox" id="admin-popup-active" checked>
                <span>팝업 노출</span>
              </label>
              <div class="admin-form__actions">
                <button type="submit" id="admin-popup-submit" class="admin-btn admin-btn--primary">팝업 등록</button>
                <button type="button" id="admin-popup-reset" class="admin-btn admin-btn--ghost">새로 작성</button>
              </div>
            </form>
            <div class="admin-card">
              <h2 class="admin-card__title">등록된 팝업</h2>
              <div id="admin-popup-list" class="admin-list"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div id="admin-media-modal" class="admin-media-modal" hidden>
    <div class="admin-media-modal__backdrop"></div>
    <div class="admin-media-modal__panel" role="dialog" aria-modal="true" aria-labelledby="admin-media-title">
      <header class="admin-media-modal__head">
        <h2 id="admin-media-title" class="admin-media-modal__title">이미지 선택</h2>
        <button type="button" id="admin-media-close" class="admin-media-modal__close" aria-label="닫기">&times;</button>
      </header>
      <div class="admin-media-modal__tabs">
        <button type="button" class="admin-media-modal__tab is-active" data-media-folder-tab="all">전체</button>
        <button type="button" class="admin-media-modal__tab" data-media-folder-tab="img">img 폴더</button>
        <button type="button" class="admin-media-modal__tab" data-media-folder-tab="uploads">Firebase Storage</button>
      </div>
      <div class="admin-media-modal__upload">
        <input type="file" id="admin-media-upload-input" accept="image/*" hidden>
        <button type="button" id="admin-media-upload-btn" class="admin-btn admin-btn--primary">새 이미지 업로드</button>
        <p class="admin-media-modal__hint">업로드한 파일은 Firebase Storage(wedding/uploads/)에 저장됩니다.</p>
      </div>
      <div id="admin-media-grid" class="admin-media-grid"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/board-content.js"></script>
  <script src="../js/media-picker.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
